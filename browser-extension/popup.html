<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairPriceLK Checker</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <img src="icon.png" width="22" height="22" alt="FairPriceLK Logo" style="border-radius: 4px; object-fit: contain;">
                <h1>FairPriceLK</h1>
            </div>
            <button id="extractBtn" class="btn btn-small btn-secondary" title="Auto-extract details from page">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                Extract
            </button>
        </header>

        <main>
            <div id="extractionStatus" class="status-msg hidden"></div>
            <div id="errorSection" class="error-msg hidden"></div>
            <button id="selectGpuManuallyBtn" class="btn btn-secondary hidden" type="button">
                Select GPU model manually
            </button>

            <!-- Redesigned Result / Intelligence Section -->
            <div id="resultSection" class="result-box hidden">
                <div class="product-identity-badge">
                    <span id="detectedCategoryTag" class="cat-tag">GPU</span>
                    <span id="detectedModelTitle" class="prod-title">Marketplace Listing</span>
                </div>

                <div class="price-comparison-grid" style="align-items: stretch;">
                    <!-- New Predicted Price Box -->
                    <div class="price-tile highlight" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                        <span class="price-tile-lbl">PREDICTED PRICE</span>
                        <span class="price-tile-val" id="predictedPrice" style="font-size: 18px; margin-top: 4px;">--</span>
                    </div>

                    <!-- Verdict Box -->
                    <div class="verdict-banner" id="verdictBanner" style="margin-top: 0; display: flex; flex-direction: column; justify-content: center;">
                        <div class="verdict-top">
                            <span id="fairnessBadge" class="verdict-title">--</span>
                            <span id="priceDiff" class="verdict-score">--</span>
                        </div>
                        <div id="verdictDescription" class="verdict-desc hidden"></div>
                    </div>
                </div>

                <!-- Score Calculation Breakdown (Collapsible) -->
                <details class="breakdown-details" id="scoreBreakdownSection">
                    <summary class="breakdown-summary">
                        <span class="breakdown-summary-title">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                            Score Breakdown & Calculation
                        </span>
                        <span class="breakdown-summary-hint">View factors</span>
                    </summary>
                    <div class="breakdown-content" id="scoreBreakdownContent">
                        <!-- Formula Callout -->
                        <div class="breakdown-formula-box" id="breakdownFormula">
                            <div class="formula-label">CALCULATION FORMULA</div>
                            <div class="formula-text" id="breakdownFormulaText">--</div>
                        </div>

                        <!-- Factor List -->
                        <div class="breakdown-factors" id="breakdownFactorsList">
                            <!-- Populated dynamically by popup.js -->
                        </div>
                    </div>
                </details>

                <div class="result-footer">
                    <span id="modelUsedName">--</span>
                </div>
            </div>

            <!-- Manual Specification Tweaks (Collapsible Details) -->
            <details class="spec-editor-details" id="specEditor">
                <summary class="spec-editor-summary">
                    <span>Listing Specifications & Inputs</span>
                    <span class="edit-hint">Click to edit</span>
                </summary>

                <div class="spec-editor-content">
                    <div class="form-group">
                        <label for="categorySelect">Product Category</label>
                        <select id="categorySelect">
                            <option value="gpu">Graphics Card (GPU)</option>
                            <option value="mobile">Mobile Phone</option>
                            <option value="vehicle">Vehicle</option>
                            <option value="electronics">Electronics (Laptop/Monitor)</option>
                        </select>
                    </div>

                    <!-- Form sections container -->
                    <div id="dynamicForms">
                        
                        <!-- GPU Form -->
                        <div id="gpuForm" class="category-form">
                            <div class="form-group">
                                <label for="gpuModelInput">GPU Model</label>
                                <div class="autocomplete-wrapper">
                                    <input type="text" id="gpuModelInput" placeholder="Type to search (e.g. RTX 3060, RX 580)" autocomplete="off">
                                    <div id="gpuModelSuggestions" class="suggestions-dropdown hidden"></div>
                                </div>
                                <span id="gpuModelError" class="field-error hidden"></span>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="gpuVramSelect">VRAM (GB)</label>
                                    <select id="gpuVramSelect">
                                        <option value="8">8 GB</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="gpuBrandSelect">Brand</label>
                                    <select id="gpuBrandSelect">
                                        <option value="Any">Any</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="gpuManufacturerSelect">Manufacturer</label>
                                <select id="gpuManufacturerSelect">
                                    <option value="Any">Any</option>
                                    <option value="NVIDIA">NVIDIA</option>
                                    <option value="AMD">AMD</option>
                                    <option value="Intel">Intel</option>
                                </select>
                            </div>
                        </div>

                        <!-- Mobile Form -->
                        <div id="mobileForm" class="category-form hidden">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="mobileTypeSelect">OS</label>
                                    <select id="mobileTypeSelect">
                                        <option value="android">Android</option>
                                        <option value="iphone">iPhone</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="mobileBrandInput">Brand</label>
                                    <input type="text" id="mobileBrandInput" placeholder="e.g. Samsung">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="mobileModelInput">Model</label>
                                <input type="text" id="mobileModelInput" placeholder="e.g. Galaxy S21">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="mobileStorageInput">Storage (GB)</label>
                                    <input type="number" id="mobileStorageInput" placeholder="128" step="1">
                                </div>
                                <div class="form-group">
                                    <label for="mobileRamInput">RAM (GB)</label>
                                    <input type="number" id="mobileRamInput" placeholder="6" step="1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="mobileWarrantyInput">Warranty (Days)</label>
                                <input type="number" id="mobileWarrantyInput" placeholder="0" step="1" value="0">
                            </div>
                        </div>

                        <!-- Vehicle Form -->
                        <div id="vehicleForm" class="category-form hidden">
                            <div class="form-group">
                                <label for="vehicleTypeSelect">Vehicle Type</label>
                                <select id="vehicleTypeSelect">
                                    <option value="cars">Cars</option>
                                    <option value="suvs">SUVs</option>
                                    <option value="vans">Vans</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="vehicleBrandSelect">Brand</label>
                                    <select id="vehicleBrandSelect"></select>
                                </div>
                                <div class="form-group">
                                    <label for="vehicleModelSelect">Model</label>
                                    <select id="vehicleModelSelect"></select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="vehicleVariantInput">Variant</label>
                                    <input type="text" id="vehicleVariantInput" placeholder="e.g. 121">
                                </div>
                                <div class="form-group">
                                    <label for="vehicleYearInput">Year</label>
                                    <input type="number" id="vehicleYearInput" placeholder="2015" step="1">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="vehicleMileageInput">Mileage (km)</label>
                                    <input type="number" id="vehicleMileageInput" placeholder="100000" step="1">
                                </div>
                                <div class="form-group">
                                    <label for="vehicleEngineCCInput">Engine (CC)</label>
                                    <input type="number" id="vehicleEngineCCInput" placeholder="1500" step="1">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="vehicleTransmissionSelect">Transmission</label>
                                    <select id="vehicleTransmissionSelect">
                                        <option value="Automatic">Automatic</option>
                                        <option value="Manual">Manual</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="vehicleFuelSelect">Fuel</label>
                                    <select id="vehicleFuelSelect">
                                        <option value="Petrol">Petrol</option>
                                        <option value="Diesel">Diesel</option>
                                        <option value="Hybrid">Hybrid</option>
                                        <option value="Electric">Electric</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="vehicleDescriptionInput">Description (Optional)</label>
                                <textarea id="vehicleDescriptionInput" placeholder="Any listing text" rows="2"></textarea>
                            </div>
                        </div>

                        <!-- Electronics Form -->
                        <div id="electronicsForm" class="category-form hidden">
                            <div class="form-group">
                                <label for="elecCategorySelect">Type</label>
                                <select id="elecCategorySelect">
                                    <option value="laptop">Laptop</option>
                                    <option value="monitor">Monitor</option>
                                    <option value="tablet">Tablet</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="elecBrandInput">Brand</label>
                                    <input type="text" id="elecBrandInput" placeholder="e.g. Dell">
                                </div>
                                <div class="form-group">
                                    <label for="elecModelInput">Model</label>
                                    <input type="text" id="elecModelInput" placeholder="e.g. XPS 13">
                                </div>
                            </div>
                            <div class="form-row" id="elecRamStorageRow">
                                <div class="form-group">
                                    <label for="elecRamInput">RAM (GB)</label>
                                    <input type="number" id="elecRamInput" placeholder="8" step="1">
                                </div>
                                <div class="form-group">
                                    <label for="elecStorageInput">Storage (GB)</label>
                                    <input type="number" id="elecStorageInput" placeholder="256" step="1">
                                </div>
                            </div>
                        </div>

                    </div> <!-- End dynamicForms -->

                    <div class="form-group" style="margin-top: 8px;">
                        <label for="priceInput">Listed Price (LKR)</label>
                        <div class="input-with-prefix">
                            <span class="prefix">Rs.</span>
                            <input type="number" id="priceInput" placeholder="85000">
                        </div>
                    </div>

                    <button id="predictBtn" class="btn btn-primary" style="margin-top: 6px;">
                        Calculate Market Value
                    </button>
                </div>
            </details>

        </main>

        <footer>
            <div class="status-indicator">
                <span id="serverStatusDot" class="dot"></span>
                <span id="serverStatusText">Checking connection...</span>
            </div>
        </footer>
    </div>
    <script src="config.js"></script>
    <script src="fairness_calculator.js"></script>
    <script src="popup.js"></script>
</body>
</html>
